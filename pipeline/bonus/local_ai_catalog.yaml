# Prices: per hour (billing: hourly, office hours only) or per month (billing: monthly, always on).
# Currency is converted with the baseline-average exchange rate (fx_monthly).
hardware:
  - id: hw:gpu-ml-01
    label: gpu-ml-01 as it is (Azure Frankfurt)
    provider: Azure
    location: DE
    gpu: "1 GPU of the 300-W class (assumed NVIDIA A40, 48 GB)"
    gpu_class: a40
    vram_gb: 48
    tdp_w: 300
    idle_w: {low: 30, mid: 60, high: 90}
    host: {vcpu: 8, ram_gb: 56}
    billing: hourly
    price: derived          # baseline cost of gpu-ml / baseline billed GPU-hours (azure_costs.csv)
    owned: true
    entity_id: srv:gpu-ml-01
    measure_ids: [M-04]
    pue: pue
    note: "VRAM is not in the data (only «300-W class»): A40 48 GB assumed. With an A100 80 GB PCIe (also 300 W), gpt-oss-120b would fit."
    source: "server_inventory.csv, azure_costs.csv, data_dictionary.md; idle W from pipeline/energy/factors.yaml"
    estimate: true
  - id: hw:gpu-ml-01-zrh
    label: gpu-ml-01 moved to Azure Zurich
    provider: Azure
    location: CH
    gpu: "same GPU as gpu-ml-01 (assumed A40, 48 GB)"
