# Catalogue for the advisory «Local AI» view (pipeline/bonus/local_ai.py).
# Open-weight models and the hardware the company has or could rent from its current providers.
# Every entry carries a source and a date; `estimate: true` marks values that are not published as such.
# Throughput = aggregate batched decode tokens/s (vLLM, concurrency 16–32), low / mid / high.

source_date: "2026-11-21"

assumptions:
  person_day_chf:
    value: 1100
    unit: CHF
    source: "data/case/README.md: 1 person-day = CHF 1,100"
    estimate: false
  office_hours_per_workday:
    value: 10
    unit: h
    source: "Assumption: hourly-billed GPUs are started for office hours only (07:00–17:00 on workdays, dim_date.workday)."
    estimate: true
  vram_headroom:
    value: 1.2
    unit: ratio
    source: "Weights × 1.2 for runtime and KV cache (vLLM deployment guidance: keep 10–20 % free for KV cache)."
    estimate: true
  host_cpu_utilisation:
    value: 0.10
    unit: ratio
    source: "Assumption: inference is GPU-bound; the host CPU mostly idles (server_metrics_weekly.csv gpu-ml-01 CPU ≈ 4–6 %)."
    estimate: true
  setup_platform_days:
    value: {low: 6, mid: 9, high: 12}
    unit: person-days
    source: >-
      Estimate from typical task breakdowns: endpoint on the GPU host (vLLM, drivers, TLS) 2–4, auth layer 2–4,
      monitoring 2–4 person-days. vLLM deployment docs (docs.vllm.ai/en/latest/deployment/) describe the steps.
    estimate: true
  setup_per_workload_days:
    value: {low: 1, mid: 2, high: 3}
    unit: person-days
    source: "Estimate: point one tool at an OpenAI-compatible local endpoint, re-test prompts and outputs."
    estimate: true
  maint_days_per_year:
    value: {low: 15, mid: 20, high: 30}
    unit: person-days per year
    source: "Estimate: model updates, vLLM / driver / OS patching, incidents, re-evaluation (≈ 0.07–0.15 FTE)."
    estimate: true

