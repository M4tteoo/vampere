    pue: pue
    note: "Switzerland North is ≈ +10 % over Germany West Central (Azure Retail Prices API, NC24ads_A100_v4 5.252 vs 4.775 USD/h). Move effort as M-05 (3.5 person-days). GPU quota in Switzerland North must be requested."
