# Tunable parameters of the GreenOps pipeline.
# Everything a team member may want to tweak lives here, never in the code.

data_dir: data/case
output_dir: output
duckdb_file: output/greenops.duckdb

# Baseline year required by the case (README «Submission»)
baseline:
  start: 2025-09-01
  end: 2026-08-31          # inclusive

# Swiss grid mix scenario of the exported numbers (B2): ch_consumption | ch_production
scenario: ch_consumption

# Bonus modules (pipeline/bonus/<name>.py, see bonus-plan.md), run in this order.
# Add a module here once its file exists, e.g. [market, scenarios, clusters, forecast,
# montecarlo, carbon_aware]. A failing module is reported and skipped unless fail_fast.
bonus:
  enabled: [text_risk, clusters, carbon_aware]
  fail_fast: false

handover:
  # Data gaps / source contradictions whose CHF impact exceeds this share of
  # their category's baseline cost are handed to a human instead of being
  # resolved automatically.
  materiality_pct_of_category: 1.0

fx:
  display_currency: CHF       # CHF | EUR | USD (frontend can override)
  # Rates used to value measure savings: baseline_avg = average of the 12
  # monthly rates of the baseline year, so FX moves never create savings.
  savings_rate_mode: baseline_avg

imputation:
  # Range of an «estimated» cost = quantity × these quantiles of the
  # resource's observed unit price.
  unit_price_range_quantiles: [0.05, 0.95]
  # Fill whole missing days of resources that are expected to bill daily.
  gap_fill: true
  gap_fill_window_days: 7     # neighbours on each side used for the median
  # Only always-on billing sources: a missing day there is a gap. In usage-
  # driven sources (AI gateway) a missing day may simply mean no usage.
  gap_fill_sources: [azure_costs.csv, aws_costs.csv, hoster_invoice.csv]
  gap_fill_min_coverage: 0.9  # resources billing on fewer expected days are periodic (e.g. monthly support fee)

units:
  mb_per_gb: 1000             # verified on log_volume and m365_usage

anomaly:
  # Candidate spikes: daily cost > ratio × rolling median of the resource.
  daily_cost_ratio_vs_rolling_median: 3.0
  rolling_window_days: 28
  min_daily_cost_chf: 5.0
  min_episode_excess_chf: 50.0   # ignore blips below this
  # A spike that persists is a level shift (new normal), not an anomaly:
  # median of the following window > this × median before the episode.
  level_shift_ratio: 2.0
  related_ticket_window_days: 14 # tickets on the same resource near the start are attached as context

# Step 5 · Find: thresholds of the waste rules (pipeline/find/rules.py)
find:
  data_as_of: 2026-09-06
  drivers_top_n: 5
  idle_cluster_min_idle_ratio: 0.50       # running but not working ≥ 50 % of hours
  low_gpu_max_utilisation: 0.10           # GPU < 10 % ...
  always_on_min_uptime_share: 0.95        # ... while running ≥ 95 % of hours
  low_cpu_max_utilisation: 0.10           # servers < 10 % CPU while always on ...
  low_cpu_min_idle_week_share: 0.75       # ... in at least 3 of 4 weeks (a few busy weeks don't hide a mostly idle server)
  zombie_min_days_since_login: 180        # no human login for 6 months ...
  zombie_max_cpu: 0.01                    # ... and practically no load
  licence_max_active_share: 0.60          # active / purchased seats below 60 %
  simple_tasks: [Classify]                # tasks a small model handles; large model = oversized
  small_large_cost_ratio: 0.30            # list price small / large (reference.yaml prices)
  stale_table_min_days_since_read: 365
  pbi_max_views_per_year: 20              # reports refreshed but (almost) never opened
  severity:                               # by impact share of the baseline (cost or CO2, whichever is higher)
    high: 0.02
    medium: 0.005

# Order matters: dimensions first (later connectors look them up).
connectors_order:
  # master data / dimensions
  - exchange_rates
  - mapping_departments_tools
  - business_calendar
  - projects
  - data_center_locations
  - headcount
  - project_hours_monthly
  # core sources
  - azure_costs
  - aws_costs
  - hoster_invoice
  - data_platform_usage
  - server_metrics_weekly
  - server_inventory
  - ai_usage
  - ai_subscriptions
  - saas_contracts
  - it_tickets
  # extra sources
  - ai_invoice_monthly
  - ai_agent_runs
  - ci_pipeline_runs
  - data_platform_jobs
  - data_catalog_tables
  - powerbi_usage
  - m365_usage
  - web_traffic
  - log_volume
  - backup_chains
  - provider_monthly_report
