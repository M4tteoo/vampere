<text x="28" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15171A">05  Power down</text>
<text x="28" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5E625F">Each letter draws less power than the last: weight and colour step down from ink to green.</text>
<g transform="translate(228.8,101.5) scale(1.35)"><g fill="none" stroke-linecap="round" stroke-linejoin="round" ><path d="M0,0 L38,100 L76,0" stroke-width="24" stroke="#15171A"/><path d="M78.6417,100 L116.642,0 L154.642,100 M95.6417,60 L137.642,60" stroke-width="20" stroke="#1A2A22"/><path d="M192.642,100 L192.642,0 L235.642,66 L278.642,0 L278.642,100" stroke-width="16.5" stroke="#183A2B"/><path d="M316.642,100 L316.642,0 L348.642,0 A26,26,0,0,1,348.642,52 L316.642,52" stroke-width="13.5" stroke="#165034"/><path d="M466.642,0 L412.642,0 L412.642,100 L466.642,100 M412.642,50 L458.642,50" stroke-width="11" stroke="#17693F"/><path d="M504.642,100 L504.642,0 L536.642,0 A26,26,0,0,1,536.642,52 L504.642,52 M534.642,52 L564.642,100" stroke-width="8.5" stroke="#1B864C"/><path d="M656.642,0 L602.642,0 L602.642,100 L656.642,100 M602.642,50 L648.642,50" stroke-width="6.5" stroke="#22A35A"/></g></g>
</g>
</svg>
