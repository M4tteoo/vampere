<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1878" width="1400" height="1878">
<title>Vampere — wordmark options</title>
<defs>
<linearGradient id="dawn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="681" y2="0"><stop offset="0" stop-color="#D21F3C"/><stop offset="0.45" stop-color="#C9A227"/><stop offset="1" stop-color="#3DDC84"/></linearGradient>
